name: tests

on:
  workflow_call:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install the project
        run: |
          uv sync --locked --group dev

      - name: Run ruff format check
        run: uv run scripts/format.py --check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install the project
        run: |
          uv sync --locked --group dev

      - name: Run ruff
        run: uv run scripts/lint.py

      - name: Run ty
        run: uv run scripts/typecheck.py

      - name: Check high-confidence dead code
        run: uv run scripts/deadcode.py

      - name: Run CPD
        run: uv run scripts/cpd.py --check

      - name: Validate internal resources
        run: uv run scripts/check_internal_resources.py

  unit-test:
    name: Unit (Python ${{ matrix.python-version }}, ${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.15"]
        shard:
          - name: llm
            paths: tests/unit/fast_agent/llm tests/unit/llm
            args: ""
          - name: ui-commands-ptc
            paths: tests/unit/fast_agent/ui tests/unit/fast_agent/commands tests/unit/fast_agent/ptc
            args: ""
          - name: other
            paths: tests/unit
            args: >-
              --ignore=tests/unit/fast_agent/llm
              --ignore=tests/unit/llm
              --ignore=tests/unit/fast_agent/ui
              --ignore=tests/unit/fast_agent/commands
              --ignore=tests/unit/fast_agent/ptc
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: |
          uv sync --locked --group dev --python ${{ matrix.python-version }}

      - name: Run unit tests
        run: uv run pytest ${{ matrix.shard.paths }} ${{ matrix.shard.args }} -n auto -q -ra --durations=20

  integration-test:
    name: Integration (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: acp
            path: tests/integration/acp
            args: ""
          - name: api
            path: tests/integration/api
            args: ""
          - name: other
            path: tests/integration
            args: >-
              --ignore=tests/integration/acp
              --ignore=tests/integration/api
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the project
        run: |
          uv sync --locked --group dev

      - name: Run integration tests
        # Keep each file together so module-scoped ACP processes are reused.
        run: uv run pytest -n 2 --dist loadfile -v --durations=20 ${{ matrix.path }} ${{ matrix.args }}

  test:
    name: test
    runs-on: ubuntu-latest
    needs:
      - unit-test
      - integration-test
    steps:
      - name: Report combined status
        run: echo "unit-test and integration-test completed"

  package-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install the project
        run: |
          uv sync --locked --group dev

      - name: Run plugin CLI env smoke test
        run: FAST_AGENT_BIN="$PWD/.venv/bin/fast-agent" bash scripts/test_plugins_cli_env.sh

      - name: Run package install test
        run: bash scripts/test_package_install.sh
