<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--ivory);color:var(--petrol);font-family:var(--font-read);-webkit-font-smoothing:antialiased}.w{padding:20px 24px}.lab{font-size:11px;font-weight:800;letter-spacing:var(--track-label);text-transform:uppercase}code{font-family:var(--font-code);font-size:12px}</style></head><body><div class="w"><div style="display:flex;gap:40px;align-items:center"><div style="display:flex;flex-direction:column;gap:10px;align-items:flex-start"><span style="background:var(--ivory);border:var(--border);border-radius:10px;padding:14px 18px;box-shadow:var(--shadow-offset);font-weight:700">--shadow-offset</span><code>6px 6px 0 amber</code></div><div style="display:flex;flex-direction:column;gap:10px;align-items:flex-start"><span style="background:var(--amber);border:var(--border);border-radius:10px;padding:14px 18px;box-shadow:var(--shadow-offset-sm);font-weight:700">--shadow-offset-sm</span><code>3px 3px 0 petrol</code></div><div style="display:flex;flex-direction:column;gap:10px;align-items:flex-start"><span style="background:var(--petrol);color:var(--ivory);border-radius:10px;padding:12px 18px;box-shadow:0 4px 0 var(--amber);font-weight:700">CTA ledge</span><code>0 4px 0 amber</code></div></div></div></body></html>
