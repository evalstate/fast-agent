<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--ivory);color:var(--petrol);font-family:var(--font-read);-webkit-font-smoothing:antialiased}.w{padding:20px 24px}.lab{font-size:11px;font-weight:800;letter-spacing:var(--track-label);text-transform:uppercase}code{font-family:var(--font-code);font-size:12px}</style></head><body><div class="w"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px"><div style="display:flex;gap:10px;align-items:center"><span style="width:36px;height:36px;border-radius:6px;border:2px solid var(--petrol);background:var(--surface-page);flex:none"></span><div><code>--surface-page</code><div style="font-size:12px">ivory</div></div></div><div style="display:flex;gap:10px;align-items:center"><span style="width:36px;height:36px;border-radius:6px;border:2px solid var(--petrol);background:var(--surface-card);flex:none"></span><div><code>--surface-card</code><div style="font-size:12px">paper</div></div></div><div style="display:flex;gap:10px;align-items:center"><span style="width:36px;height:36px;border-radius:6px;border:2px solid var(--petrol);background:var(--surface-inverse);flex:none"></span><div><code>--surface-inverse</code><div style="font-size:12px">petrol</div></div></div><div style="display:flex;gap:10px;align-items:center"><span style="width:36px;height:36px;border-radius:6px;border:2px solid var(--petrol);background:var(--text-muted);flex:none"></span><div><code>--text-muted</code><div style="font-size:12px">72% petrol</div></div></div><div style="display:flex;gap:10px;align-items:center"><span style="width:36px;height:36px;border-radius:6px;border:2px solid var(--petrol);background:var(--line);flex:none"></span><div><code>--line</code><div style="font-size:12px">14% petrol</div></div></div><div style="display:flex;gap:10px;align-items:center"><span style="width:36px;height:36px;border-radius:6px;border:2px solid var(--petrol);background:var(
