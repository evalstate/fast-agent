<!-- @dsCard group="Motion" viewport="700x170" subtitle="Ratchet burst, prompt caret, chevron chase" name="Loading" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;background:var(--ivory);color:var(--petrol);font-family:var(--font-read);-webkit-font-smoothing:antialiased;}
.w{padding:20px 24px;box-sizing:border-box;min-height:170px;}
.lab{font-size:11px;font-weight:800;letter-spacing:var(--track-label);text-transform:uppercase;}
.voice{font-family:var(--font-voice);font-weight:900;font-variation-settings:var(--voice-settings);letter-spacing:var(--track-voice);}

</style></head><body><div class="w">

<div style="display:flex;align-items:center;gap:44px">
<div style="text-align:center"><img src="../assets/burst-capsule-amber.svg" width="56" style="animation:fa-ratchet 1.1s var(--ease-ratchet) infinite"><div class="lab" style="margin-top:8px">Ratchet</div></div>
<div style="text-align:center"><div style="font-family:var(--font-code);font-size:22px"><span style="color:var(--petrol)">❯</span><span style="display:inline-block;width:11px;height:22px;background:var(--amber);vertical-align:-4px;margin-left:6px;animation:fa-prompt 1s steps(1) infinite"></span></div><div class="lab" style="margin-top:8px">Caret</div></div>
<div style="text-align:center"><div style="display:flex;gap:2px"><img src="../assets/mark-chevron.svg" width="26" style="animation:fa-chevrons 1.2s var(--ease-ui) 0s infinite"><img src="../assets/mark-chevron.svg" width="26" style="animation:fa-chevrons 1.2s var(--ease-ui) 0.18s infinite"><img src="../assets/mark-chevron.svg" width="26" style="animation:fa-chevrons 1.2s var(--ease-ui) 0.36s infinite"></div><div class="lab" style="margin-top:8px">Chase</div></div>
<div style="font-size:12.5px;line-height:1.55;max-width:230px">It turns in 72° steps (one arm) and pauses between them, so it "clicks" instead of spinning. No shimmer skeletons: use a flat ivory-deep block.</div>
</div>
</div></body></html>
