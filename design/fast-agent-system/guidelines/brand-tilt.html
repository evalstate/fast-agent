<!-- @dsCard group="Brand" viewport="700x200" subtitle="Stickers sit at −4° to −10°; data never tilts" name="The tilt" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;background:var(--ivory);color:var(--petrol);font-family:var(--font-read);-webkit-font-smoothing:antialiased;}
.w{padding:20px 24px;box-sizing:border-box;min-height:200px;}
.lab{font-size:11px;font-weight:800;letter-spacing:var(--track-label);text-transform:uppercase;}
.voice{font-family:var(--font-voice);font-weight:900;font-variation-settings:var(--voice-settings);letter-spacing:var(--track-voice);}

</style></head><body><div class="w">

<div style="display:flex;align-items:center;gap:40px">
<div style="position:relative;width:150px;height:150px;transform:rotate(-8deg)">
<img src="../assets/burst-capsule-amber.svg" width="150" style="position:absolute;left:7px;top:7px">
<img src="../assets/burst-capsule-orange.svg" width="150" style="position:absolute;left:0;top:0">
<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-shout);color:var(--ivory);font-size:30px">New!</div>
</div>
<div style="font-size:13px;line-height:1.6;max-width:360px"><b>Tilt:</b> bursts, stickers and illustration badges only. Default −8°, and one tilted element per view.<br><b>Never tilt:</b> headlines, body copy, tables, charts or buttons. The tilt is the salesman; the data stays level.</div>
</div>
</div></body></html>
