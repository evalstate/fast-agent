<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;background:var(--ivory);color:var(--petrol);font-family:var(--font-read);-webkit-font-smoothing:antialiased;}
.w{padding:20px 24px;box-sizing:border-box;min-height:150px;}
.lab{font-size:11px;font-weight:800;letter-spacing:var(--track-label);text-transform:uppercase;}
.voice{font-family:var(--font-voice);font-weight:900;font-variation-settings:var(--voice-settings);letter-spacing:var(--track-voice);}

</style></head><body><div class="w">

<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">
<div><div style="height:64px;border-radius:10px;background:#FFF7E8;border:2px solid var(--petrol)"></div><div style="font-weight:800;font-size:13px;margin-top:8px">Ivory #FFF7E8</div><div style="font-size:12px">--ivory · ground</div></div><div><div style="height:64px;border-radius:10px;background:#082C34;"></div><div style="font-weight:800;font-size:13px;margin-top:8px">Petrol #082C34</div><div style="font-size:12px">--petrol · ink + dark ground</div></div><div><div style="height:64px;border-radius:10px;background:#FFB52E;"></div><div style="font-weight:800;font-size:13px;margin-top:8px">Amber #FFB52E</div><div style="font-size:12px">--amber · fast-agent accent</div></div>
</div>
</div></body></html>
