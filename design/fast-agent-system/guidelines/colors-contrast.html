<!-- @dsCard group="Colors" viewport="700x190" subtitle="Which combinations can carry text" name="Contrast pairs" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;background:var(--ivory);color:var(--petrol);font-family:var(--font-read);-webkit-font-smoothing:antialiased;}
.w{padding:20px 24px;box-sizing:border-box;min-height:190px;}
.lab{font-size:11px;font-weight:800;letter-spacing:var(--track-label);text-transform:uppercase;}
.voice{font-family:var(--font-voice);font-weight:900;font-variation-settings:var(--voice-settings);letter-spacing:var(--track-voice);}

</style></head><body><div class="w">

<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;font-size:13px;font-weight:700">
<div style="background:var(--ivory);border:2px solid var(--petrol);border-radius:10px;padding:14px">Petrol on ivory<br><span style="font-weight:400">13.9 : 1 ✓</span></div>
<div style="background:var(--petrol);color:var(--amber);border-radius:10px;padding:14px">Amber on petrol<br><span style="font-weight:400">8.4 : 1 ✓</span></div>
<div style="background:var(--ivory);color:var(--teal);border:2px solid var(--petrol);border-radius:10px;padding:14px">Teal on ivory<br><span style="font-weight:400">4.6 : 1 ✓ (min)</span></div>
<div style="background:var(--ivory);color:var(--amber);border:2px dashed var(--petrol);border-radius:10px;padding:14px">Amber on ivory<br><span style="font-weight:400">1.7 : 1 ✗ fill only</span></div>
<div style="background:var(--petrol);color:var(--teal);border-radius:10px;padding:14px">Teal on petrol<br><span style="font-weight:400">3.0 : 1 ✗</span></div>
<div style="background:var(--orange);color:var(--ivory);border-radius:10px;padding:14px">Ivory on orange<br><span style="font-weight:400">3.3 : 1 · display only</span></div>
</div>
</div></body></html>
