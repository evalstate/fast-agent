<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;background:var(--ivory);color:var(--petrol);font-family:var(--font-read);-webkit-font-smoothing:antialiased;}
.w{padding:20px 24px;box-sizing:border-box;min-height:150px;}
.lab{font-size:11px;font-weight:800;letter-spacing:var(--track-label);text-transform:uppercase;}
.voice{font-family:var(--font-voice);font-weight:900;font-variation-settings:var(--voice-settings);letter-spacing:var(--track-voice);}

</style></head><body><div class="w">

<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div style="border:var(--border);border-radius:14px;padding:18px;display:flex;align-items:center;gap:14px"><img src="../assets/icon-tile.svg" width="40"><span class="voice" style="font-size:40px;line-height:1">fast-agent</span></div>
<div style="background:var(--petrol);color:var(--ivory);border-radius:14px;padding:18px;display:flex;align-items:center;gap:14px"><img src="../assets/icon-tile-amber.svg" width="40"><span class="voice" style="font-size:40px;line-height:1">fast-agent</span></div>
</div>
</div></body></html>
