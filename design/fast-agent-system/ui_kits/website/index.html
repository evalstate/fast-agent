<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<script type="text/babel">
const { Toast } = window.FastAgentDesignSystem_3898e4;
const LABELS = { guides: 'Guides', agents: 'Agents', models: 'Models', acp: 'ACP', a2a: 'A2A', mcp: 'MCP', reference: 'Reference' };
function App() {
  const [route, setRoute] = React.useState((location.hash || '#home').slice(1));
  const [msg, setMsg] = React.useState(null);
  const go = r => { setRoute(r); history.replaceState(null, '', '#' + r); window.scrollTo(0, 0); };
  const toast = m => { setMsg(m); clearTimeout(window.__t); window.__t = setTimeout(() => setMsg(null), 2200); };
  const page = route === 'home' ? <HomePage go={go} toast={toast} /> : route === 'benchmarks' ? <BenchmarksPage go={go} /> : <DocsPage key={route} section={LABELS[route] || 'Guides'} toast={toast} />;
  return <>
    <SiteHeader route={LABELS[route] || route === 'benchmarks' ? route : 'home'} go={go} />
    {page}
    <SiteFooter go={go} />
    {msg && <div style={{ position: 'fixed', left: 24, bottom: 24, zIndex: 50 }}><Toast onClose={() => setMsg(null)}>{msg}</Toast></div>}
  </>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
