default_model: passthrough

logger:
  type: console
  level: error
  show_chat: false
  show_tools: false

mcp:
  servers:
    dreamtune:
      command: npx
      args: ["-y", "--package", "@dreamtune/sdk@0.1.2", "dreamtune-mcp"]
      env:
        DREAMTUNE_API_KEY: "${DREAMTUNE_API_KEY}"
        DREAMTUNE_API_ORIGIN: https://api.dreamtunelabs.com
        DREAMTUNE_REQUEST_TIMEOUT_MS: "60000"
